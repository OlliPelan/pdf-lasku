<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Luo Lasku</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-gray-100 p-4 font-sans">

    <!-- Mobiilisovelluksen näkymä (lomake) -->
    <div class="max-w-md mx-auto bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">Uusi lasku</h1>
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Asiakkaan nimi tai yritys</label>
                <input type="text" id="asiakas" class="w-full border border-gray-300 rounded-lg p-3 outline-none focus:border-blue-500" placeholder="Esim. Asiakas Oy">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Laskutettava työ</label>
                <input type="text" id="kuvaus" class="w-full border border-gray-300 rounded-lg p-3 outline-none focus:border-blue-500" placeholder="Esim. Ikkunoiden pesu">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Veroton hinta (€)</label>
                <input type="number" id="hinta" class="w-full border border-gray-300 rounded-lg p-3 outline-none focus:border-blue-500" placeholder="150">
            </div>

            <button onclick="luoPDF()" class="w-full bg-blue-600 text-white font-semibold rounded-lg p-4 mt-4 hover:bg-blue-700 active:bg-blue-800 transition">
                Luo PDF ja lataa
            </button>
        </div>
    </div>

    <!-- Piilotettu PDF-tulostuspohja -->
    <div style="display: none;">
        <div id="lasku-pohja" class="bg-white p-12 text-gray-800" style="width: 210mm; min-height: 297mm; box-sizing: border-box;">
            <div class="border-b-2 border-blue-600 pb-6 mb-8 flex justify-between items-end">
                <h2 class="text-4xl text-blue-600 font-bold uppercase tracking-wide">Lasku</h2>
                <div class="text-right text-sm">
                    <strong>Pvm:</strong> <span id="out-pvm"></span><br>
                    <strong>Eräpäivä:</strong> <span id="out-erapaiva"></span>
                </div>
            </div>

            <div class="flex justify-between mb-12 text-sm">
                <div>
                    <p class="font-bold text-xs text-gray-500 uppercase mb-1">Laskuttaja</p>
                    <p class="font-bold text-lg">Oma Yritys Oy</p>
                    <p>Y-tunnus: 1234567-8</p>
                    <p>Esimerkkikatu 1, 00100 Helsinki</p>
                </div>
                <div>
                    <p class="font-bold text-xs text-gray-500 uppercase mb-1">Asiakas</p>
                    <p class="font-bold text-lg" id="out-asiakas">[Asiakas]</p>
                </div>
            </div>

            <table class="w-full text-left border-collapse mb-12">
                <thead>
                    <tr class="bg-gray-100">
                        <th class="p-3 border-b border-gray-300">Kuvaus</th>
                        <th class="p-3 border-b border-gray-300 text-right">Veroton hinta</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="p-3 border-b border-gray-200" id="out-kuvaus">[Kuvaus]</td>
                        <td class="p-3 border-b border-gray-200 text-right" id="out-hinta">0,00 €</td>
                    </tr>
                </tbody>
            </table>

            <div class="w-1/2 ml-auto">
                <div class="flex justify-between py-2 text-sm border-b border-gray-200">
                    <span>ALV (25,5 %):</span>
                    <span id="out-alv">0,00 €</span>
                </div>
                <div class="flex justify-between py-3 text-lg font-bold border-b-2 border-blue-600">
                    <span>Yhteensä maksettava:</span>
                    <span id="out-yhteensa">0,00 €</span>
                </div>
            </div>

            <div class="absolute bottom-12 left-12 right-12 text-xs text-gray-500 border-t border-gray-200 pt-6 flex justify-between">
                <div>
                    <strong>Saaja:</strong> Oma Yritys Oy<br>
                    <strong>IBAN:</strong> FI00 1234 5678 9012 34
                </div>
                <div class="text-right">
                    <br>
                    <strong>Viitenumero:</strong> 10427
                </div>
            </div>
        </div>
    </div>

    <script>
        function formatoiPvm(lisaysPaivat = 0) {
            const date = new Date();
            date.setDate(date.getDate() + lisaysPaivat);
            return date.toLocaleDateString('fi-FI');
        }

        function luoPDF() {
            // Hae arvot
            const asiakas = document.getElementById('asiakas').value || 'Tuntematon asiakas';
            const kuvaus = document.getElementById('kuvaus').value || 'Ei kuvausta';
            const hinta = parseFloat(document.getElementById('hinta').value || 0);
            
            // Laske summat
            const alv = hinta * 0.255;
            const yhteensa = hinta + alv;

            // Päivitä piilotettuun pohjaan
            document.getElementById('out-asiakas').innerText = asiakas;
            document.getElementById('out-kuvaus').innerText = kuvaus;
            document.getElementById('out-pvm').innerText = formatoiPvm(0);
            document.getElementById('out-erapaiva').innerText = formatoiPvm(14);
            
            const muotoile = (summa) => summa.toFixed(2).replace('.', ',') + ' €';
            document.getElementById('out-hinta').innerText = muotoile(hinta);
            document.getElementById('out-alv').innerText = muotoile(alv);
            document.getElementById('out-yhteensa').innerText = muotoile(yhteensa);

            // Generoi PDF
            const element = document.getElementById('lasku-pohja');
            element.parentElement.style.display = 'block'; 
            
            const tiedostonimi = 'Lasku_' + asiakas.replace(/\s+/g, '_') + '.pdf';
            const opt = {
                margin:       0,
                filename:     tiedostonimi,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(element).save().then(() => {
                element.parentElement.style.display = 'none';
            });
        }
    </script>
</body>
</html>
