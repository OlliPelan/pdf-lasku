<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Luo Lasku</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tuodaan jsPDF, joka piirtää oikean PDF-tiedoston luotettavasti mobiilissa -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-gray-100 p-4 font-sans pb-10">

    <div class="max-w-md mx-auto bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">Uusi lasku</h1>
        
        <div class="space-y-5">
            <!-- Omat tiedot -->
            <div class="p-4 bg-gray-50 rounded-lg border border-gray-100 space-y-3">
                <h2 class="text-sm font-bold text-gray-500 uppercase tracking-wide">Omat tiedot</h2>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Laskuttajan nimi</label>
                    <input type="text" id="laskuttaja" class="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:border-blue-500" placeholder="Oma Nimesi / Yritys">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Oma Y-tunnus (valinnainen)</label>
                    <input type="text" id="laskuttaja_ytunnus" class="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:border-blue-500" placeholder="Esim. 1234567-8">
                </div>
            </div>

            <!-- Asiakkaan tiedot -->
            <div class="p-4 bg-gray-50 rounded-lg border border-gray-100 space-y-3">
                <h2 class="text-sm font-bold text-gray-500 uppercase tracking-wide">Asiakkaan tiedot</h2>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Asiakkaan nimi</label>
                    <input type="text" id="asiakas" class="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:border-blue-500" placeholder="Asiakkaan nimi">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Asiakkaan Y-tunnus (valinnainen)</label>
                    <input type="text" id="asiakas_ytunnus" class="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:border-blue-500" placeholder="Esim. 9876543-2">
                </div>
            </div>

            <!-- Laskun rivit -->
            <div class="space-y-3 pt-2">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Laskutettava työ</label>
                    <input type="text" id="kuvaus" class="w-full border border-gray-300 rounded-lg p-3 outline-none focus:border-blue-500" placeholder="Esim. Ikkunoiden pesu">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Veroton hinta (€)</label>
                    <input type="number" id="hinta" class="w-full border border-gray-300 rounded-lg p-3 outline-none focus:border-blue-500" placeholder="150">
                </div>
            </div>

            <button onclick="luoPDF()" class="w-full bg-blue-600 text-white font-semibold rounded-lg p-4 mt-2 hover:bg-blue-700 active:bg-blue-800 transition shadow-md">
                Luo PDF ja lataa
            </button>
        </div>
    </div>

    <script>
        function formatoiPvm(lisaysPaivat = 0) {
            const date = new Date();
            date.setDate(date.getDate() + lisaysPaivat);
            return date.toLocaleDateString('fi-FI');
        }

        function luoPDF() {
            // Hae lomakkeen arvot
            const laskuttaja = document.getElementById('laskuttaja').value || 'Oma Nimi';
            const laskuttaja_yt = document.getElementById('laskuttaja_ytunnus').value;
            const asiakas = document.getElementById('asiakas').value || 'Tuntematon asiakas';
            const asiakas_yt = document.getElementById('asiakas_ytunnus').value;
            const kuvaus = document.getElementById('kuvaus').value || 'Ei kuvausta';
            const hinta = parseFloat(document.getElementById('hinta').value || 0);
            
            // Laske summat
            const alv = hinta * 0.255;
            const yhteensa = hinta + alv;
            const muotoile = (summa) => summa.toFixed(2).replace('.', ',') + ' EUR';

            // Alusta PDF
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });

            // 1. OTSIKKO
            doc.setFontSize(24);
            doc.setTextColor(37, 99, 235); // Sininen
            doc.setFont("helvetica", "bold");
            doc.text("LASKU", 20, 30);

            // 2. PÄIVÄMÄÄRÄT
            doc.setFontSize(10);
            doc.setTextColor(0, 0, 0);
            doc.setFont("helvetica", "normal");
            doc.text(`Pvm: ${formatoiPvm(0)}`, 190, 25, { align: "right" });
            doc.text(`Erapaiva: ${formatoiPvm(14)}`, 190, 31, { align: "right" });

            // Yläviiva
            doc.setDrawColor(37, 99, 235);
            doc.setLineWidth(0.5);
            doc.line(20, 38, 190, 38);

            // 3. OSOITETIEDOT
            doc.setFontSize(9);
            doc.setTextColor(107, 114, 128); // Harmaa
            doc.setFont("helvetica", "bold");
            doc.text("LASKUTTAJA", 20, 50);
            doc.text("ASIAKAS", 105, 50);

            doc.setFontSize(12);
            doc.setTextColor(17, 24, 39); // Tummanharmaa
            doc.text(laskuttaja, 20, 56);
            doc.text(asiakas, 105, 56);

            doc.setFontSize(10);
            doc.setFont("helvetica", "normal");
            if (laskuttaja_yt) doc.text(`Y-tunnus: ${laskuttaja_yt}`, 20, 62);
            if (asiakas_yt) doc.text(`Y-tunnus: ${asiakas_yt}`, 105, 62);

            // 4. TAULUKON OTSIKOT
            doc.setFillColor(243, 244, 246); // Vaaleanharmaa tausta
            doc.rect(20, 75, 170, 10, "F");
            doc.setFont("helvetica", "bold");
            doc.text("Kuvaus", 23, 82);
            doc.text("Veroton hinta", 187, 82, { align: "right" });

            // 5. TAULUKON SISÄLTÖ
            doc.setFont("helvetica", "normal");
            doc.text(kuvaus, 23, 93);
            doc.text(muotoile(hinta), 187, 93, { align: "right" });
            
            // Alaviiva
            doc.setDrawColor(229, 231, 235);
            doc.line(20, 98, 190, 98);

            // 6. SUMMAT
            doc.setFontSize(11);
            doc.text("ALV (25,5 %):", 130, 110);
            doc.text(muotoile(alv), 187, 110, { align: "right" });

            doc.setFontSize(14);
            doc.setFont("helvetica", "bold");
            doc.text("Yhteensa:", 130, 120);
            doc.text(muotoile(yhteensa), 187, 120, { align: "right" });
            
            // Loppusumman viiva
            doc.setDrawColor(37, 99, 235);
            doc.line(130, 124, 190, 124);

            // 7. ALATUNNISTE (Maksutiedot)
            doc.setDrawColor(229, 231, 235);
            doc.line(20, 270, 190, 270);
            
            doc.setFontSize(9);
            doc.setFont("helvetica", "normal");
            doc.setTextColor(107, 114, 128);
            doc.text(`Saaja: ${laskuttaja}`, 20, 277);
            doc.text("IBAN: FI00 1234 5678 9012 34", 20, 282);
            
            doc.setFont("helvetica", "bold");
            doc.text("Viitenumero: 10427", 190, 282, { align: "right" });

            // Tallenna PDF
            const tiedostonimi = 'Lasku_' + asiakas.replace(/\s+/g, '_') + '.pdf';
            doc.save(tiedostonimi);
        }
    </script>
</body>
</html>
