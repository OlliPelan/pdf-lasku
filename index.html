<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Luo Lasku</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-gray-100 p-4 font-sans">

    <!-- Mobiilisovelluksen näkymä (lomake) -->
    <div class="max-w-md mx-auto bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">Uusi lasku</h1>
        
        <div class="space-y-5">
            <div class="p-4 bg-gray-50 rounded-lg border border-gray-100 space-y-3">
                <h2 class="text-sm font-bold text-gray-500 uppercase tracking-wide">Omat tiedot</h2>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Laskuttajan nimi</label>
                    <input type="text" id="laskuttaja" class="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:border-blue-500" placeholder="Oma Nimesi / Yritys">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Oma Y-tunnus (valinnainen)</label>
                    <input type="text" id="laskuttaja_ytunnus" class="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:border-blue-500" placeholder="Esim. 1234567-8">
                </div>
            </div>

            <div class="p-4 bg-gray-50 rounded-lg border border-gray-100 space-y-3">
                <h2 class="text-sm font-bold text-gray-500 uppercase tracking-wide">Asiakkaan tiedot</h2>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Asiakkaan nimi</label>
                    <input type="text" id="asiakas" class="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:border-blue-500" placeholder="Asiakkaan nimi">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Asiakkaan Y-tunnus (valinnainen)</label>
                    <input type="text" id="asiakas_ytunnus" class="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:border-blue-500" placeholder="Esim. 9876543-2">
                </div>
            </div>

            <div class="space-y-3 pt-2">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Laskutettava työ</label>
                    <input type="text" id="kuvaus" class="w-full border border-gray-300 rounded-lg p-3 outline-none focus:border-blue-500" placeholder="Esim. Ikkunoiden pesu">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Veroton hinta (€)</label>
                    <input type="number" id="hinta" class="w-full border border-gray-300 rounded-lg p-3 outline-none focus:border-blue-500" placeholder="150">
                </div>
            </div>

            <button onclick="luoPDF()" class="w-full bg-blue-600 text-white font-semibold rounded-lg p-4 mt-2 hover:bg-blue-700 active:bg-blue-800 transition">
                Luo PDF ja lataa
            </button>
        </div>
    </div>

    <!-- PIILOTETTU PDF-POHJA (Pakotettu työpöytäasettelu) -->
    <div style="position: absolute; left: -9999px; top: 0;">
        <div id="lasku-pohja" style="width: 800px; padding: 50px; background-color: white; color: #111827; font-family: Arial, sans-serif; box-sizing: border-box;">
            
            <div style="display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid #2563eb; padding-bottom: 20px; margin-bottom: 40px;">
                <h2 style="font-size: 38px; color: #2563eb; font-weight: bold; margin: 0; text-transform: uppercase; letter-spacing: 1px;">Lasku</h2>
                <div style="text-align: right; font-size: 15px;">
                    <strong>Pvm:</strong> <span id="out-pvm"></span><br>
                    <strong>Eräpäivä:</strong> <span id="out-erapaiva"></span>
                </div>
            </div>

            <div style="display: flex; justify-content: space-between; margin-bottom: 50px; font-size: 15px;">
                <div style="width: 48%;">
                    <p style="font-size: 12px; color: #6b7280; text-transform: uppercase; font-weight: bold; margin-bottom: 5px;">Laskuttaja</p>
                    <p style="font-size: 18px; font-weight: bold; margin: 0 0 4px 0;" id="out-laskuttaja"></p>
                    <p style="margin: 0;" id="out-laskuttaja-ytunnus-container">Y-tunnus: <span id="out-laskuttaja-ytunnus"></span></p>
                </div>
                <div style="width: 48%;">
                    <p style="font-size: 12px; color: #6b7280; text-transform: uppercase; font-weight: bold; margin-bottom: 5px;">Asiakas</p>
                    <p style="font-size: 18px; font-weight: bold; margin: 0 0 4px 0;" id="out-asiakas"></p>
                    <p style="margin: 0;" id="out-asiakas-ytunnus-container">Y-tunnus: <span id="out-asiakas-ytunnus"></span></p>
                </div>
            </div>

            <table style="width: 100%; border-collapse: collapse; margin-bottom: 40px; font-size: 15px;">
                <thead>
                    <tr style="background-color: #f3f4f6;">
                        <th style="padding: 12px; text-align: left; border-bottom: 1px solid #d1d5db;">Kuvaus</th>
                        <th style="padding: 12px; text-align: right; border-bottom: 1px solid #d1d5db;">Veroton hinta</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td style="padding: 12px; border-bottom: 1px solid #e5e7eb;" id="out-kuvaus"></td>
                        <td style="padding: 12px; text-align: right; border-bottom: 1px solid #e5e7eb;" id="out-hinta"></td>
                    </tr>
                </tbody>
            </table>

            <div style="display: flex; justify-content: flex-end; font-size: 15px;">
                <div style="width: 50%;">
                    <div style="display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #e5e7eb;">
                        <span>ALV (25,5 %):</span>
                        <span id="out-alv"></span>
                    </div>
                    <div style="display: flex; justify-content: space-between; padding: 15px 0; font-size: 18px; font-weight: bold; border-bottom: 2px solid #2563eb;">
                        <span>Yhteensä maksettava:</span>
                        <span id="out-yhteensa"></span>
                    </div>
                </div>
            </div>

            <div style="margin-top: 80px; padding-top: 20px; border-top: 1px solid #e5e7eb; font-size: 13px; color: #6b7280; display: flex; justify-content: space-between;">
                <div>
                    <strong>Saaja:</strong> <span id="out-footer-laskuttaja"></span><br>
                    <strong>IBAN:</strong> FI00 1234 5678 9012 34
                </div>
                <div style="text-align: right;">
                    <br>
                    <strong>Viitenumero:</strong> 10427
                </div>
            </div>
        </div>
    </div>

    <script>
        function formatoiPvm(lisaysPaivat = 0) {
            const date = new Date();
            date.setDate(date.getDate() + lisaysPaivat);
            return date.toLocaleDateString('fi-FI');
        }

        function luoPDF() {
            // Hae arvot
            const laskuttaja = document.getElementById('laskuttaja').value || 'Oma Nimi';
            const laskuttaja_yt = document.getElementById('laskuttaja_ytunnus').value;
            const asiakas = document.getElementById('asiakas').value || 'Tuntematon asiakas';
            const asiakas_yt = document.getElementById('asiakas_ytunnus').value;
            const kuvaus = document.getElementById('kuvaus').value || 'Ei kuvausta';
            const hinta = parseFloat(document.getElementById('hinta').value || 0);
            
            // Laske summat
            const alv = hinta * 0.255;
            const yhteensa = hinta + alv;

            // Päivitä tekstit
            document.getElementById('out-laskuttaja').innerText = laskuttaja;
            document.getElementById('out-footer-laskuttaja').innerText = laskuttaja;
            document.getElementById('out-asiakas').innerText = asiakas;
            document.getElementById('out-kuvaus').innerText = kuvaus;
            document.getElementById('out-pvm').innerText = formatoiPvm(0);
            document.getElementById('out-erapaiva').innerText = formatoiPvm(14);
            
            // Y-tunnusten näkyvyys
            document.getElementById('out-laskuttaja-ytunnus-container').style.display = laskuttaja_yt ? 'block' : 'none';
            if (laskuttaja_yt) document.getElementById('out-laskuttaja-ytunnus').innerText = laskuttaja_yt;

            document.getElementById('out-asiakas-ytunnus-container').style.display = asiakas_yt ? 'block' : 'none';
            if (asiakas_yt) document.getElementById('out-asiakas-ytunnus').innerText = asiakas_yt;

            // Hinnat
            const muotoile = (summa) => summa.toFixed(2).replace('.', ',') + ' €';
            document.getElementById('out-hinta').innerText = muotoile(hinta);
            document.getElementById('out-alv').innerText = muotoile(alv);
            document.getElementById('out-yhteensa').innerText = muotoile(yhteensa);

            // Generoi PDF kiinteillä asetuksilla (korjaa mobiilivirheet)
            const element = document.getElementById('lasku-pohja');
            const tiedostonimi = 'Lasku_' + asiakas.replace(/\s+/g, '_') + '.pdf';
            
            const opt = {
                margin:       10, // mm
                filename:     tiedostonimi,
                image:        { type: 'jpeg', quality: 1 },
                html2canvas:  { 
                    scale: 2, 
                    scrollY: 0, // Estää yläreunan tyhjän tilan, jos olet skrollannut alaspäin
                    windowWidth: 800 // Pakottaa A4-työpöytäasettelun riippumatta puhelimen koosta
                },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(element).save();
        }
    </script>
</body>
</html>
