<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Luo Lasku</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-gray-100 p-4 font-sans pb-10">

    <div class="max-w-md mx-auto bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">Uusi lasku</h1>
        
        <div class="space-y-6">
            
            <!-- Yleiset tiedot (Ylinnä) -->
            <div class="p-4 bg-gray-50 rounded-xl border border-gray-100 space-y-4 shadow-sm">
                <h2 class="text-xs font-bold text-blue-600 uppercase tracking-wider">Laskun perustiedot</h2>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Laskun numero</label>
                        <input type="number" id="laskun_numero" value="1001" class="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 font-bold text-gray-800">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Eräpäivä</label>
                        <input type="date" id="erapaiva" class="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                    </div>
                </div>
            </div>

            <!-- Omat tiedot -->
            <div class="p-4 bg-gray-50 rounded-xl border border-gray-100 space-y-4">
                <h2 class="text-xs font-bold text-gray-500 uppercase tracking-wider">Omat tiedot (Laskuttaja)</h2>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nimi / Yritys</label>
                    <input type="text" id="laskuttaja" class="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" placeholder="Oma Nimesi">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Katuosoite ja postitoimipaikka</label>
                    <input type="text" id="laskuttaja_osoite" class="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" placeholder="Esim. Esimerkkitie 1, 00100 Helsinki">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Y-tunnus</label>
                        <input type="text" id="laskuttaja_ytunnus" class="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" placeholder="1234567-8">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">IBAN-tilinumero</label>
                        <input type="text" id="iban" class="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" placeholder="FI00...">
                    </div>
                </div>
            </div>

            <!-- Asiakkaan tiedot -->
            <div class="p-4 bg-gray-50 rounded-xl border border-gray-100 space-y-4">
                <h2 class="text-xs font-bold text-gray-500 uppercase tracking-wider">Asiakkaan tiedot</h2>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Asiakkaan nimi</label>
                    <input type="text" id="asiakas" class="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" placeholder="Matti Meikäläinen">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Osoite</label>
                    <input type="text" id="asiakas_osoite" class="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" placeholder="Asiakkaan osoite">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Asiakkaan Y-tunnus</label>
                    <input type="text" id="asiakas_ytunnus" class="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" placeholder="9876543-2">
                </div>
            </div>

            <!-- Laskutettava työ -->
            <div class="p-4 bg-gray-50 rounded-xl border border-gray-100 space-y-4">
                <h2 class="text-xs font-bold text-gray-500 uppercase tracking-wider">Laskutettava työ</h2>
                <div class="flex gap-3">
                    <div class="w-1/3">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Työn pvm</label>
                        <input type="date" id="tyo_pvm" class="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                    </div>
                    <div class="w-2/3">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Kuvaus</label>
                        <input type="text" id="kuvaus" class="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" placeholder="Esim. Ikkunoiden pesu">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Veroton hinta (€)</label>
                        <input type="number" id="hinta" class="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" placeholder="150">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">ALV %</label>
                        <select id="alv_prosentti" class="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                            <option value="25.5">25,5 %</option>
                            <option value="13.5">13,5 %</option>
                            <option value="10">10 %</option>
                            <option value="0">0 %</option>
                        </select>
                    </div>
                </div>
            </div>

            <button onclick="luoPDF()" class="w-full bg-blue-600 text-white font-bold text-lg rounded-xl p-4 mt-2 hover:bg-blue-700 active:bg-blue-800 transition shadow-md">
                Luo PDF ja lataa
            </button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date();
            const due = new Date(today);
            due.setDate(due.getDate() + 14); 
            const formatDateForInput = (date) => date.toISOString().split('T')[0];

            document.getElementById('tyo_pvm').value = formatDateForInput(today);
            document.getElementById('erapaiva').value = formatDateForInput(due);
        });

        function muotoilePvmSuomeksi(dateString) {
            if (!dateString) return "";
            const [year, month, day] = dateString.split('-');
            return `${day}.${month}.${year}`;
        }

        function getTanaan() {
            const date = new Date();
            return `${date.getDate()}.${date.getMonth() + 1}.${date.getFullYear()}`;
        }

        function luoViitenumero(laskuNro) {
            const satunnainen = Math.floor(1000 + Math.random() * 9000); 
            const runko = String(laskuNro) + String(satunnainen);

            const kertoimet = [7, 3, 1];
            let summa = 0;
            for (let i = runko.length - 1, j = 0; i >= 0; i--, j++) {
                summa += parseInt(runko[i], 10) * kertoimet[j % 3];
            }
            const tarkistus = (10 - (summa % 10)) % 10;
            const viite = runko + String(tarkistus);
            
            return viite.split('').reverse().join('').replace(/(.{5})/g, '$1 ').split('').reverse().join('').trim();
        }

        function luoPDF() {
            const laskun_numero = document.getElementById('laskun_numero').value || '1001';
            const viitenumero = luoViitenumero(laskun_numero);

            const laskuttaja = document.getElementById('laskuttaja').value || 'Oma Nimi';
            const laskuttaja_osoite = document.getElementById('laskuttaja_osoite').value;
            const laskuttaja_yt = document.getElementById('laskuttaja_ytunnus').value;
            const iban = document.getElementById('iban').value || 'Ei ilmoitettu';
            
            const asiakas = document.getElementById('asiakas').value || 'Tuntematon asiakas';
            const asiakas_osoite = document.getElementById('asiakas_osoite').value;
            const asiakas_yt = document.getElementById('asiakas_ytunnus').value;
            
            const erapaiva = muotoilePvmSuomeksi(document.getElementById('erapaiva').value);
            const tyo_pvm = muotoilePvmSuomeksi(document.getElementById('tyo_pvm').value);
            const kuvaus = document.getElementById('kuvaus').value || 'Ei kuvausta';
            
            const hinta = parseFloat(document.getElementById('hinta').value || 0);
            const alvValintaStr = document.getElementById('alv_prosentti').value;
            const alvProsentti = parseFloat(alvValintaStr);
            
            const alv = hinta * (alvProsentti / 100); 
            const yhteensa = hinta + alv;
            const muotoile = (summa) => summa.toFixed(2).replace('.', ',') + ' EUR';

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });

            // OTSIKKO JA PÄIVÄMÄÄRÄT
            doc.setFontSize(24);
            doc.setTextColor(37, 99, 235);
            doc.setFont("helvetica", "bold");
            doc.text("LASKU", 20, 30);

            doc.setFontSize(10);
            doc.setTextColor(0, 0, 0);
            doc.setFont("helvetica", "normal");
            doc.text(`Pvm: ${getTanaan()}`, 190, 23, { align: "right" });
            doc.text(`Laskun nro: ${laskun_numero}`, 190, 29, { align: "right" });
            doc.text(`Erapaiva: ${erapaiva}`, 190, 35, { align: "right" });

            doc.setDrawColor(37, 99, 235);
            doc.setLineWidth(0.5);
            doc.line(20, 42, 190, 42);

            // OSOITETIEDOT
            doc.setFontSize(9);
            doc.setTextColor(107, 114, 128);
            doc.setFont("helvetica", "bold");
            doc.text("LASKUTTAJA", 20, 52);
            doc.text("ASIAKAS", 105, 52);

            doc.setFontSize(11);
            doc.setTextColor(17, 24, 39);
            
            let lY = 58;
            doc.text(laskuttaja, 20, lY);
            doc.setFontSize(10);
            doc.setFont("helvetica", "normal");
            if (laskuttaja_osoite) { lY += 5; doc.text(laskuttaja_osoite, 20, lY); }
            if (laskuttaja_yt) { lY += 5; doc.text(`Y-tunnus: ${laskuttaja_yt}`, 20, lY); }

            let aY = 58;
            doc.setFontSize(11);
            doc.setFont("helvetica", "bold");
            doc.text(asiakas, 105, aY);
            doc.setFontSize(10);
            doc.setFont("helvetica", "normal");
            if (asiakas_osoite) { aY += 5; doc.text(asiakas_osoite, 105, aY); }
            if (asiakas_yt) { aY += 5; doc.text(`Y-tunnus: ${asiakas_yt}`, 105, aY); }

            // TAULUKKO (Sarakkeet eroteltu päällekkäisyyden estämiseksi)
            doc.setFillColor(243, 244, 246);
            doc.rect(20, 82, 170, 10, "F");
            doc.setFont("helvetica", "bold");
            doc.text("Pvm", 23, 89);
            doc.text("Kuvaus", 50, 89);
            doc.text("Veroton hinta", 187, 89, { align: "right" });

            doc.setFont("helvetica", "normal");
            if (tyo_pvm) {
                doc.text(tyo_pvm, 23, 100);
            }
            doc.text(kuvaus, 50, 100);
            doc.text(muotoile(hinta), 187, 100, { align: "right" });
            
            doc.setDrawColor(229, 231, 235);
            doc.line(20, 106, 190, 106);

            // SUMMAT
            doc.setFontSize(11);
            const alvOtsikko = `ALV (${alvValintaStr.replace('.', ',')} %):`;
            doc.text(alvOtsikko, 130, 118);
            doc.text(muotoile(alv), 187, 118, { align: "right" });

            doc.setFontSize(14);
            doc.setFont("helvetica", "bold");
            doc.text("Yhteensa:", 130, 128);
            doc.text(muotoile(yhteensa), 187, 128, { align: "right" });
            
            doc.setDrawColor(37, 99, 235);
            doc.line(130, 132, 190, 132);

            // ALATUNNISTE
            doc.setDrawColor(229, 231, 235);
            doc.line(20, 270, 190, 270);
            
            doc.setFontSize(9);
            doc.setFont("helvetica", "normal");
            doc.setTextColor(107, 114, 128);
            doc.text(`Saaja: ${laskuttaja}`, 20, 277);
            doc.text(`IBAN: ${iban}`, 20, 282);
            
            doc.setFont("helvetica", "bold");
            doc.text(`Viitenumero: ${viitenumero}`, 190, 282, { align: "right" });

            const tiedostonimi = 'Lasku_' + asiakas.replace(/\s+/g, '_') + '.pdf';
            doc.save(tiedostonimi);
        }
    </script>
</body>
</html>
